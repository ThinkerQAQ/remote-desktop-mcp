name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: runner.os != 'Windows'
        run: bash -n setup.sh install.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($file in @('setup.ps1','install.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/$file", [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw "PowerShell syntax validation failed" }
          }
          if ($parseErrors.Count) { throw "PowerShell syntax validation failed" }
      - name: Native bootstrap and private configuration (synthetic credentials)
        env:
          DV_TUNNEL_ID: tunnel_EXAMPLE
          DV_RUNTIME_API_KEY: synthetic-ci-only
          DV_FORCE_MANAGED_NODE: ${{ matrix.node == 24 && '1' || '0' }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File setup.ps1 --non-interactive --configure-only
          else
            bash setup.sh --non-interactive --configure-only
          fi
      - run: npm run audit:high
      - run: npm run check
      - run: npm run smoke
