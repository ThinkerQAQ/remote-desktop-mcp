name: Native Offline Installers
on:
  pull_request:
    paths:
      - 'packaging/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/offline-installers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            arch: amd64
            extension: exe
          - os: ubuntu-24.04
            target: linux
            arch: amd64
            extension: run
          - os: macos-15
            target: darwin
            arch: amd64
            extension: dmg
    runs-on: ${{ matrix.os }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run smoke
      - name: Test offline installer security and metadata
        run: python -m unittest discover -s packaging/tests -v
      - name: Install Qt Installer Framework builder
        uses: jurplel/install-qt-action@v4
        with:
          no-qt-binaries: 'true'
          tools: tools_ifw
      - name: Build fully bundled payload from verified releases
        run: python packaging/stage_runtime.py --platform ${{ matrix.target }} --arch ${{ matrix.arch }} --output dist/stage
      - name: Confirm bundled MCP works without system Node
        shell: bash
        run: |
          if [[ '${{ matrix.target }}' == 'windows' ]]; then
            dist/stage/bin/node.exe dist/stage/scripts/smoke.mjs
          else
            dist/stage/bin/node dist/stage/scripts/smoke.mjs
          fi
      - name: Verify Windows first-run GUI works without terminal TTY
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File "dist/stage/Configure-RemoteDesktop.ps1" -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Windows configuration GUI self test failed' }
      - name: Build native offline Qt installer
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          python packaging/qt_installer.py \
            --platform "${{ matrix.target }}" --stage dist/stage \
            --version "$version" \
            --output "dist/RemoteDesktopMCP-v${version}-${{ matrix.target }}-${{ matrix.arch }}.${{ matrix.extension }}"
      - name: Verify Windows installer does not open a console
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from packaging.windows_gui_template import WINDOWS_GUI, pe_subsystem; files = list(Path('dist').glob('RemoteDesktopMCP-v*-windows-amd64.exe')); assert len(files) == 1, files; assert pe_subsystem(files[0]) == WINDOWS_GUI, 'Windows installer must use GUI subsystem'"
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteDesktopMCP-${{ matrix.target }}-${{ matrix.arch }}-offline
          path: dist/RemoteDesktopMCP-*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14
